<script>
  // Set active navigation link based on current page
  document.addEventListener('DOMContentLoaded', function() {
    // Get current page filename
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const currentFileName = currentPage.split('?')[0]; // Remove query parameters

    // Get all navigation links
    const navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      const dataPage = link.getAttribute('data-page');
      
      // Check if the href matches the current page
      if (href === currentFileName || 
          (currentFileName === '' && href === 'index.html') ||
          currentFileName === 'common.html') {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });

    // Update current date on page load
    const currentDateElement = document.getElementById('currentDate');
    if (currentDateElement) {
      const today = new Date();
      const options = { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      };
      const formattedDate = today.toLocaleDateString('en-US', options);
      currentDateElement.textContent = formattedDate;
    }
  });
</script>
