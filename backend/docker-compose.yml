version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: code-titans-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-n3u3da!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
       
    networks:
      - code-titans-network
     

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: code-titans-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-project}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      mysql
        
    networks:
      - code-titans-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-server
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - code-titans-network

volumes:
  mysql_data:

networks:
  code-titans-network:
    driver: bridge
